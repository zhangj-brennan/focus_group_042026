<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scrolly Conversation</title>

  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>

  <style>
    @font-face {
  font-family: "Benton";
  src: url("Benton Sans/Benton Sans Book.otf");
}

@font-face {
  font-family: "BentonStrong";
  src: url("Benton Sans/Benton Sans Bold.otf");
}

@font-face {
  font-family: "BentonMedium";
  src: url("Benton Sans/Benton Sans Medium.otf");
}

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Benton", sans-serif;
      background: #ffffff;
      color: #111;
    }

    .page {
      width: 100%;
    }

    .intro {
      max-width: 760px;
      margin: 0 auto;
      padding: 80px 24px 40px;
    }

    .intro h1 {
      font-size: 14px;
      line-height: 1.05;
      margin: 0 0 16px;
    }

    .intro p {
      font-size: 11px;
      line-height: 2;
      margin: 0;
    }

    .scrolly-section {
      position: relative;
      min-height: 120vh;
      padding: 40px 0 80px;
      border-top: 1px solid #111;
    }

    .sticky-header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: #ffffff;
      border-bottom: 1px solid #111;
      padding: 18px 24px;
    }

    .sticky-header-inner {
      max-width: 900px;
      margin: 0 auto;
    }

    .section-kicker {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 6px;
    }

    .section-title {
      font-size: 18px;
      line-height: 1.6;
      font-weight: 700;
    }

    .conversation {
      max-width: 900px;
      margin: 0 auto;
      padding: 60px 24px;
    }

    .bubble-row {
        padding:20px;
      display: flex;
      align-items: center;
      opacity: 0.25;
      transition: opacity 300ms ease;
    }

    .bubble-row.active {
      opacity: 1;
    }

    .bubble-row.left {
      justify-content: flex-start;
    }

    .bubble-row.right {
      justify-content: flex-end;
    }
    .bubble-row.center {
  justify-content: center;
  text-align: center;
}
.bubble-row.center .bubble::after {
  left: 50%;
  transform: translateX(-50%) rotate(45deg);
}
    .bubble {
      width: min(620px, 100%);
      border: 2px solid #111;
      padding: 22px 24px;
      position: relative;
      box-shadow: 8px 8px 0 #111;
    }

    .bubble::after {
      content: "";
      position: absolute;
      bottom: -18px;
      width: 28px;
      height: 28px;
      background: inherit;
      border-right: 2px solid #111;
      border-bottom: 2px solid #111;
      transform: rotate(45deg);
    }

    .bubble-row.left .bubble::after {
      left: 36px;
    }

    .bubble-row.right .bubble::after {
      right: 36px;
    }

    .speaker {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 14px;
      border-bottom: 1px solid #111;
      padding-bottom: 8px;
    }

    .person {
      font-weight: 700;
      font-size: 18px;
    }

    .id {
      font-size: 13px;
      opacity: 0.75;
      text-align: right;
    }

    .quote {
      font-size: 14px;
      line-height: 1.35;
    }

    .quote::before {
      content: "“";
    }

    .quote::after {
      content: "”";
    }

    .end-spacer {
      height: 40vh;
    }

   

    /* Safer sizing everywhere */
html,
body {
  width: 100%;
  overflow-x: hidden;
}

.page,
#scrolly {
  width: 100%;
}

.conversation {
  width: min(100% - 2 * var(--gutter), 900px);
}

/* desktop/default bubble width should never exceed screen */
.bubble {
  width: min(620px, 100%);
  max-width: 100%;
}

@media (max-width: 700px) {
  :root {
    --gutter: 16px;
  }

  .conversation {
    width: calc(100% - 2 * var(--gutter));
    padding: 28px 0;
  }

  /* Keep vertical rhythm but not huge */
  .bubble-row {
    min-height: auto;
    padding: 36px 0;
    display: flex;
  }

  /* 👇 Restore left/right alignment */
  .bubble-row.left {
    justify-content: flex-start;
  }

  .bubble-row.right {
    justify-content: flex-end;
  }

  .bubble-row.center {
    justify-content: center;
  }

  /* 👇 IMPORTANT: constrain width so alignment is visible */
  .bubble {
    width: 70%;
    max-width: 300px;
    padding: 18px;
  }

  /* 👇 Fix tails per side */
  .bubble-row.left .bubble::after {
    left: 24px;
    right: auto;
    transform: rotate(45deg);
  }

  .bubble-row.right .bubble::after {
    right: 24px;
    left: auto;
    transform: rotate(45deg);
  }

  .bubble-row.center .bubble::after {
    left: 50%;
    transform: translateX(-50%) rotate(45deg);
  }

  /* Typography tweaks */
  .quote {
    font-size: 16px;
    line-height: 1.35;
  }

  .person {
    font-size: 12px;
  }

  .id {
    font-size: 12px;
    text-align: left;
  }
}
  </style>
</head>

<body>
  <main class="page">
    <section class="intro">
      <h1>Scrolly Conversation</h1>
      <p>
       test
      </p>
    </section>

    <div id="scrolly"></div>
  </main>
<script>
  const PERSON_COLORS = {
    "D": "#6CBAD6",
    "I": "#FFCF01",
    "R":"#F69679"
  };

  const PERSON_SIDES = {
    "D": "left",
    "I": "center",
    "R":"right"
  };

const DEFAULT_SIDE = "center";
  const DEFAULT_COLOR = "#E5E5E5";

  d3.json("data_short.json").then(data => {
    const scrolly = d3.select("#scrolly");

    const sections = scrolly
      .selectAll(".scrolly-section")
      .data(data)
      .join("section")
      .attr("class", "scrolly-section");

    const headers = sections.append("div").attr("class", "sticky-header");
    const headerInner = headers.append("div").attr("class", "sticky-header-inner");

    // headerInner.append("div")
    //   .attr("class", "section-kicker")
    //   .text((d, i) => `Section ${i + 1}`);

   headerInner
  .append("div")
  .attr("class", "section-title")
  .html(d => d.header);

    const conversations = sections.append("div").attr("class", "conversation");

    const rows = conversations
      .selectAll(".bubble-row")
      .data(d => d.conversation)
      .join("div")
        .attr("class", d => `bubble-row ${PERSON_SIDES[d.id.split(",")[0]] || DEFAULT_SIDE}`);
    const messageWrap = rows
      .append("div")
      .attr("class", "message-wrap");

    // messageWrap
    //   .append("img")
    //   .attr("class", "avatar")
    //   .attr("src", d => d.avatar || "avatars/default.png")
    //   .attr("alt", d => d.person);
    var colorsTemp = ["red","green","blue"]
    const bubbles = messageWrap
      .append("div")
      .attr("class", "bubble")

        .style("width", d => {
            const len = d.quote.length;
            if (len < 80) return "220px";
            if (len < 160) return "320px";
            if (len < 300) return "420px";
            return "400px";
    })
     // .style("background",colorsTemp[Math.round[Math.random()*colorsTemp.length()]])
      .style("background", d => PERSON_COLORS[d.id.split(",")[0]] || DEFAULT_COLOR);

    const speaker = bubbles.append("div").attr("class", "speaker");

    speaker.append("div")
      .attr("class", "person")
      .text(d => d.person);

    speaker.append("div")
      .attr("class", "id")
      .text(d => d.id);

    bubbles.append("div")
      .attr("class", "quote")
      .text(d => d.quote);

    scrolly.append("div").attr("class", "end-spacer");

    const observer = new IntersectionObserver(
      entries => {
        entries.forEach(entry => {
          d3.select(entry.target).classed("active", entry.isIntersecting);
        });
      },
      { threshold: 0.55 }
    );

    document.querySelectorAll(".bubble-row").forEach(row => observer.observe(row));
  });
</script>
</body>
</html>
